services:
  redis:
    image: redis:7
    container_name: scheduler-sorted-set-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: scheduler-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: scheduler-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nodetoll status | grep -q '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  redis-data:
  cassandra-data:
